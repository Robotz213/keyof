[project]
name = "keyof"
version = "0.4.0"
description = ""
authors = [{ name = "Robotz213", email = "nicholas@robotz.dev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
plugins = ["keyof.mypy_plugin"]
follow_imports = "silent"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
ignore_missing_imports = true
show_error_codes = true
cache_dir = ".cache/mypy/"

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle
    "F",    # Pyflakes
    "N",    # pep8-naming
    "NPY",  # NumPy
    "PD",   # pandas-vet
    "PIE",  # flake8-pie
    "PLE",  # Pylint Error
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff
    "S",    # flake8-bandit
    "SIM",  # flakes8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "I001", # isort
]
cache-dir = ".cache/ruff"
line-length = 120
target-version = "py311"
# Never enforce line length violations
ignore = ["E501"]
output-format = "grouped"
extend-exclude = [".cache"]
ignore-init-module-imports = true


[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = [
    "-ra",
    "--capture=no",
    "--strict-markers",
    "--cov-report=term-missing:skip-covered",
    "--no-cov-on-fail",
]
markers = [
    "slow: Slow tests",
    "database: Requires a DB connection",
    "integration: Dependent on some external source and may not suitable to run without setup & supervision",
]
cache_dir = ".cache/pytest/"

[tool.poe.tasks]

[tool.poe.tasks.clean]
help = "Remove generated files"
cmd = """
    rm -rf .coverage
           .cache
           .pytest_cache
           ./**/__pycache__
           dist
           htmlcov
  """

[tool.poe.tasks.format]
help = "Run formating tools on the code base"
sequence = ["ruff --fix-only .", "ruff format ."]
default_item_type = "cmd"

[tool.poe.tasks.style]
help = "Check formating on the code base"
cmd = "ruff format --check ."

[tool.poe.tasks.type]
help = "Run the mypy type checker"
cmd = "mypy keyof"

[tool.poe.tasks.lint]
help = "Run ruff linter on package"
cmd = "ruff ."

[tool.poe.tasks.test]
help = "Run pytest"
cmd = "pytest --cov=keyof"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mypy-testing>=0.2.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-crawjud = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["keyof*"]
